name: Android Release (AAB)

# Gera o Android App Bundle (.aab) assinado para carregar na Google Play
# Console, sem precisar de um PC local. Corre à mão: Actions → "Android
# Release (AAB)" → Run workflow. O .aab fica nos artefactos da execução.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   chave de upload (.jks) codificada em base64
#   ANDROID_KEYSTORE_PASSWORD password do keystore
#   ANDROID_KEY_ALIAS         alias da chave dentro do keystore
#   ANDROID_KEY_PASSWORD      password da chave
#   CARTO_API_KEY             (opcional) estilo do mapa igual ao do site

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (inteiro, maior que o último carregado na Play Store). Vazio = número da execução + 1"
        required: false
        default: ""
      version_name:
        description: "versionName mostrado aos utilizadores"
        required: false
        default: "1.0"

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltam os secrets:$missing"
            exit 1
          fi

      - name: Setup Node.js 21
        uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm config set fetch-timeout 60000
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --prefer-offline --no-audit

      - name: Build React
        working-directory: mobile
        env:
          VITE_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed App Bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # As expressões do GitHub não fazem contas; o +1 evita chocar com o
          # versionCode 1 de um eventual primeiro carregamento feito à mão.
          export VERSION_CODE="${INPUT_VERSION_CODE:-$((RUN_NUMBER + 1))}"
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo "::error::versionCode tem de ser um inteiro: $VERSION_CODE"; exit 1 ;;
          esac
          echo "versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          ./gradlew bundleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
