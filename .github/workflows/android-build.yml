name: Android Build

on:
  push:
    branches: [main]
  # Também nos PRs que mexem na app, para uma alteração ao Android (SDK,
  # Gradle, código nativo) ser validada antes do merge e não só depois.
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 21
        uses: actions/setup-node@v5
        with:
          node-version: 21

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm config set fetch-timeout 60000
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --prefer-offline --no-audit

      - name: Build React
        working-directory: mobile
        env:
          # O estilo do mapa da app tem de ser o mesmo do site: CARTO Voyager.
          # O Vite injeta a chave no bundle durante o build, por isso ela tem
          # de existir AQUI — sem o secret `CARTO_API_KEY` definido no
          # repositório, a APK cai para os tiles do OpenStreetMap e fica com
          # um mapa visualmente diferente do site.
          VITE_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
